<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Hub virtual network with gateway, firewall and Bastion, peered to two spoke virtual networks and connected to on-premises">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ffb648"/></marker></defs>
<rect width="800" height="480" rx="14" fill="#111111"/>
<text x="24" y="40" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#f2f2f2">Pattern: hub-spoke network topology</text><rect x="24" y="190" width="136" height="100" rx="10" fill="#191919" stroke="#9a9a9a" stroke-width="1.5"/><text x="92" y="234" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">On-premises</text><text x="92" y="256" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#9a9a9a" text-anchor="middle">network</text><line x1="162" y1="240" x2="296" y2="240" stroke="#ffb648" stroke-width="2" marker-end="url(#ar)"/><text x="229" y="230" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#9a9a9a" text-anchor="middle">VPN / ER</text><rect x="300" y="110" width="210" height="260" rx="10" fill="#191919" stroke="#ffb648" stroke-width="1.5"/><text x="405" y="140" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#ffb648" text-anchor="middle">Hub VNet</text><text x="405" y="160" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#9a9a9a" text-anchor="middle">shared services</text><rect x="316" y="178" width="178" height="34" rx="8" fill="#222222" stroke="#3a3a3a" stroke-width="1"/><text x="405" y="200" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#f2f2f2" text-anchor="middle">Gateway (VPN / ExpressRoute)</text><rect x="316" y="222" width="178" height="34" rx="8" fill="#222222" stroke="#3a3a3a" stroke-width="1"/><text x="405" y="244" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#f2f2f2" text-anchor="middle">Azure Firewall</text><rect x="316" y="266" width="178" height="34" rx="8" fill="#222222" stroke="#3a3a3a" stroke-width="1"/><text x="405" y="288" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#f2f2f2" text-anchor="middle">Azure Bastion</text><rect x="316" y="310" width="178" height="34" rx="8" fill="#222222" stroke="#3a3a3a" stroke-width="1"/><text x="405" y="332" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#f2f2f2" text-anchor="middle">Shared DNS</text><rect x="600" y="70" width="176" height="120" rx="10" fill="#191919" stroke="#6ee7d8" stroke-width="1.5"/><text x="688" y="110" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#6ee7d8" text-anchor="middle">Spoke VNet 1</text><text x="688" y="134" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#f2f2f2" text-anchor="middle">workload subnets</text><text x="688" y="154" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9a9a9a" text-anchor="middle">NSGs + UDRs</text><rect x="600" y="290" width="176" height="120" rx="10" fill="#191919" stroke="#6ee7d8" stroke-width="1.5"/><text x="688" y="330" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#6ee7d8" text-anchor="middle">Spoke VNet 2</text><text x="688" y="354" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#f2f2f2" text-anchor="middle">workload subnets</text><text x="688" y="374" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9a9a9a" text-anchor="middle">NSGs + UDRs</text><line x1="512" y1="200" x2="598" y2="130" stroke="#6ee7d8" stroke-width="2"/><line x1="512" y1="280" x2="598" y2="350" stroke="#6ee7d8" stroke-width="2"/><text x="555" y="154" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#9a9a9a" text-anchor="middle">peering</text><text x="555" y="336" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#9a9a9a" text-anchor="middle">peering</text><text x="24" y="462" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="12" fill="#9a9a9a">Reference pattern: Microsoft Azure Architecture Center. Diagram drawn by Steelline.</text>
</svg>
